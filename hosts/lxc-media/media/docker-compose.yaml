networks:
  media:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - media
    ports:
      - 8096:8096
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/media:/media:ro        # read-only for jellyfin
      - /mnt/music:/music:ro
    devices:
      - /dev/dri:/dev/dri           # iGPU passthrough for QuickSync transcoding
    environment:
      - TZ=America/Toronto

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    networks:
      - media
    ports:
      - 4533:4533
    volumes:
      - ./navidrome/data:/data
      - /mnt/music:/music:ro        # same music mount as jellyfin, read-only
    environment:
      - TZ=America/Toronto
      - ND_SCANSCHEDULE=@every 1h   # rescan library every hour
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 9696:9696
    volumes:
      - ./prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 8989:8989
    volumes:
      - ./sonarr/config:/config
      - /mnt/media:/media           # needs write access for hardlinks
      - /mnt/downloads:/downloads   # same mount as qbittorrent: enables hardlinks
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 7878:7878
    volumes:
      - ./radarr/config:/config
      - /mnt/media:/media
      - /mnt/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 8686:8686
    volumes:
      - ./lidarr/config:/config
      - /mnt/music:/music
      - /mnt/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    networks:
      - media
    ports:
      - 5030:5030
      - 2234:2234
    volumes:
      - ./slskd/config:/app/config
      - /mnt/downloads:/app/downloads
      - /mnt/music:/app/music
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD}

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    networks:
      - media
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      - TZ=America/Toronto

  qbittorrent:
    depends_on:
      gluetun:
        condition: service_healthy
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun   # all traffic through gluetun
    volumes:
      - ./qbittorrent/config:/config
      - /mnt/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WEBUI_PORT=8080

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 8191:8191
    environment:
      - TZ=America/Toronto

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    networks:
      - media
    ports:
      - 5055:5055
    volumes:
      - ./jellyseerr/config:/app/config
    environment:
      - TZ=America/Toronto
