networks:
  misc:
    driver: bridge

services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ergo
    restart: unless-stopped
    networks:
      - misc
    ports:
      - "6667:6667"
      - "8080:8080"
    volumes:
      - ./ergo/config:/ircd

  csc111-demo:
    image: tsl0922/ttyd:alpine
    container_name: csc111-demo
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 7681:7681
    working_dir: /app
    command: >
      sh -c "apk add --no-cache python3 git &&
      ([ -d .git ] && git pull || git clone https://github.com/joshuaspiral/csc111p1 .) &&
      ttyd -p 7681 -W -u 1000 -g 1000 python3 adventure.py"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

