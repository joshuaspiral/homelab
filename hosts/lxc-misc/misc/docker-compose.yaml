networks:
  misc:
    driver: bridge
services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ergo
    restart: unless-stopped
    networks:
      - misc
    ports:
      - "6667:6667"
      - "8080:8080"
    volumes:
      - ./ergo/config:/ircd

syncthing:
  image: syncthing/syncthing:latest
  container_name: syncthing
  restart: unless-stopped
  networks:
    - misc
  ports:
    - 8384:8384   # WebUI
    - 22000:22000 # Sync protocol
  volumes:
    - ./syncthing/config:/var/syncthing/config
    - /mnt/org:/var/syncthing/org
  environment:
    - PUID=1000
    - PGID=1000
