networks:
  misc:
    driver: bridge
services:
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    container_name: ergo
    restart: unless-stopped
    networks:
      - misc
    ports:
      - "6667:6667"
      - "8080:8080"
    volumes:
      - ./ergo/config:/ircd

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - ./syncthing/config:/config
      - /mnt/org:/var/syncthing/org
    environment:
      - PUID=1000
      - PGID=1000
