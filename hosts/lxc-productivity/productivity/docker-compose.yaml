networks:
  productivity:
    driver: bridge

services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 8000:8000
    volumes:
      - ./paperless-ngx/data:/usr/src/paperless/data
      - /mnt/documents/consume:/usr/src/paperless/consume   # adf scanner drops files here
      - /mnt/documents/export:/usr/src/paperless/export
      - /mnt/documents/media:/usr/src/paperless/media       # processed documents live here
      - ./scripts:/scripts
    env_file:
      - .env
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-postgres
      - PAPERLESS_DBNAME=${PAPERLESS_DBNAME}
      - PAPERLESS_DBUSER=${PAPERLESS_DBUSER}
      - PAPERLESS_DBPASS=${PAPERLESS_DBPASS}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_URL=${PAPERLESS_URL}
      - PAPERLESS_OCR_LANGUAGE=eng
      - PAPERLESS_OCR_MODE=skip_noarchive  # don't re-OCR docs that already have text layer
      - PAPERLESS_CONSUMER_POLLING=60       # check consume folder every 60s
      - PAPERLESS_POST_CONSUME_SCRIPT=/scripts/chandra_ocr.py
      - PAPERLESS_API_URL=http://localhost:8000/api/documents/
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN}
      - PAPERLESS_URL=https://paperless.joshuaspiral.xyz
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=https://paperless.joshuaspiral.xyz
      - TZ=America/Toronto
    depends_on:
      - paperless-redis
      - paperless-postgres

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - productivity

  paperless-postgres:
    image: postgres:15-alpine
    container_name: paperless-postgres
    restart: unless-stopped
    networks:
      - productivity
    volumes:
      - ./paperless-ngx/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${PAPERLESS_DBNAME}
      - POSTGRES_USER=${PAPERLESS_DBUSER}
      - POSTGRES_PASSWORD=${PAPERLESS_DBPASS}

  # all this for paperless!!!
  chandra-poller:
      image: ghcr.io/paperless-ngx/paperless-ngx:latest
      container_name: chandra-poller
      restart: unless-stopped
      networks:
        - productivity
      volumes:
        - ./scripts:/scripts
      env_file:
        - .env
      environment:
        - PAPERLESS_API_URL=http://paperless-ngx:8000/api/documents/
      entrypoint: python3 /scripts/chandra_poll.py
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 8080:80
    volumes:
      - ./vaultwarden/data:/data
    environment:
      - DOMAIN=https://vault.joshuaspiral.xyz
      - SIGNUPS_ALLOWED=false      # disable after creating account
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - TZ=America/Toronto

  couchdb:
    # Obsidian LiveSync backend
    image: couchdb:3
    container_name: couchdb
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 5984:5984
    volumes:
      - ./obsidian-livesync/data:/opt/couchdb/data
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}

  baikal:
    image: ckulka/baikal:nginx
    container_name: baikal
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 8008:80
    volumes:
      - ./baikal/config:/var/www/baikal/config
      - ./baikal/Specific:/var/www/baikal/Specific

  # https://github.com/actualbudget/actual/blob/master/packages/sync-server/docker-compose.yml
  actual-budget:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      - '5006:5006'
    # environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.org/docs/config/
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - ./actual-budget:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  csc111-demo:
      image: tsl0922/ttyd:alpine
      container_name: csc111-demo
      restart: unless-stopped
      networks:
        - productivity
      ports:
        - 7681:7681
      working_dir: /app
      command: >
        sh -c "apk add --no-cache python3 git &&
        ([ -d .git ] && git pull || git clone https://github.com/joshuaspiral/csc111p1 .) &&
        ttyd -p 7681 -W -u 1000 -g 1000 python3 adventure.py"
      deploy:
          resources:
            limits:
              cpus: '0.5'
              memory: 256M

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    networks:
      - productivity
    ports:
      - 8081:80
