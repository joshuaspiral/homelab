networks:
  storage:
    driver: bridge

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    networks:
      - storage
    ports:
      - 8081:80
    volumes:
      - /mnt/files:/srv              # root of what filebrowser can see
      - /mnt/music:/srv/music        # expose music too
      - /mnt/media:/srv/media        # and media
      - ./filebrowser/config:/config
      - ./filebrowser/database:/database
    environment:
      - PUID=1000
      - PGID=1000

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    networks:
      - storage
    ports:
      - 5030:5030   # web UI
      - 50300:50300 # Soulseek listener port
    volumes:
      - ./slskd/config:/app          # slskd.yml lives here
      - /mnt/downloads/slsk:/downloads  # downloads land here
      - /mnt/music:/music            # beets-organized library for sharing
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_HTTP_AUTHENTICATION_USERNAME=${SLSKD_USERNAME}
      - SLSKD_HTTP_AUTHENTICATION_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_JWT_KEY=${SLSKD_JWT_KEY}

  beets:
    # Beets runs as a one-shot CLI tool, not a persistent server
    # Use: docker compose run --rm beets import /downloads
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    networks:
      - storage
    volumes:
      - ./beets/config:/config
      - /mnt/music:/music            # organized library destination
      - /mnt/downloads/slsk:/downloads  # source for imports
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
